[package]
name = "req-guard"
version = "0.1.0"
edition = "2021"
description = "AI 需求门禁：三段清单审核（需求分解/技术方案/测试计划）+ 硬拦截"

[[bin]]
name = "req-guard"
path = "src/main.rs"

# default 不含任何 UI 依赖：`cargo build` 仍是零依赖、秒级构建。
# 需要界面时再开 feature（见《UI架构细化方案.md》§1.1）。
[features]
default = []
# CLI + TUI（依赖小：ratatui + crossterm）
tui = ["dep:req-guard-tui"]
# CLI + GUI（依赖大：eframe ≈ 18–64MB，含内嵌中文字体）
gui = ["dep:req-guard-gui"]
# 三合一：单二进制自动探测（桌面 → GUI，SSH → TUI）
full = ["tui", "gui"]

[dependencies]
req-guard-core = { path = "../core" }
req-guard-tui = { path = "../tui", optional = true }
req-guard-gui = { path = "../gui", optional = true }
