name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（按 rust-toolchain.toml）
        run: |
          rustup show
          rustup component add clippy rustfmt

      - name: 格式检查
        run: cargo fmt --all --check

      - name: 静态检查（零警告为门槛）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 单元测试（全 workspace）
        run: cargo test --workspace

      - name: 拦截脚本场景验证
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python || echo python)
          "$PY" scripts/verify_gate.py

      - name: 构建 release（默认：零 UI 依赖）
        run: cargo build --release

      - name: 构建 release（含 TUI）
        run: cargo build -p req-guard --release --features tui
