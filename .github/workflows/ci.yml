name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Windows runner 默认用 cp1252：Python 步骤一输出中文就 UnicodeEncodeError
  # （脚本内部亦已显式 UTF-8，此处是第二道保险）
  PYTHONIOENCODING: utf-8

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # GUI crate 在 Linux 不参与 lint / test：gui 的 eframe 关了 default-features，
        # 连带 x11 / wayland / winit-default 后端未启用 → ubuntu 上编 winit 直接
        #   error: The platform you're compiling for is not supported by winit
        # 与下方「构建 release（含 GUI）」的 runner.os != 'Linux' 门控保持一致；
        # Windows / macOS 仍全量覆盖 gui（gui_excl 为空）。
        #
        # 平台差异放在 matrix 维度而不是 job 级 env：`runner` 上下文在
        # jobs.<job_id>.env 中**不可用**（该处只支持 github/needs/strategy/matrix/
        # vars/secrets/inputs），写 `runner.os == 'Linux'` 会直接报
        # "Unrecognized named-value: 'runner'"。matrix 值在渲染期即为字面量，
        # 也不依赖 shell 的变量展开语义。
        include:
          - os: ubuntu-latest
            gui_excl: "--exclude req-guard-gui"
          - os: windows-latest
            gui_excl: ""
          - os: macos-latest
            gui_excl: ""
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（按 rust-toolchain.toml）
        run: |
          rustup show
          rustup component add clippy rustfmt

      - name: 格式检查
        run: cargo fmt --all --check

      - name: 静态检查（零警告为门槛）
        run: cargo clippy --workspace --all-targets ${{ matrix.gui_excl }} -- -D warnings

      - name: 单元测试（全 workspace）
        run: cargo test --workspace ${{ matrix.gui_excl }}

      - name: 拦截脚本场景验证
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python || echo python)
          "$PY" scripts/verify_gate.py

      - name: 构建 release（默认：零 UI 依赖）
        run: cargo build --release

      - name: 构建 release（含 TUI）
        run: cargo build -p req-guard --release --features tui

      - name: 构建 release（含 GUI）
        if: runner.os != 'Linux'
        # Linux 编不了 GUI 的根因是 eframe 的 x11 / wayland 后端 feature 未启用
        # （见 gui/Cargo.toml 的「平台约束」），而非单纯缺系统库；GUI 也不在发布矩阵内，
        # 故只在 Windows / macOS 原生执行机构建。
        run: cargo build -p req-guard --release --features gui

  # 门禁自举演示（给使用方项目的 CI 样例，见 templates/ci/req-guard-ci.yml）：
  # 实际验证 install --verify、check、ids --check 三个命令的完整生命周期，
  # 并让该样例随 install 生成。
  gate-selfcheck:
    name: gate self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust 工具链
        run: rustup show
      - name: 构建 req-guard
        run: cargo build --release
      - name: L3 门禁全流程自举验证
        shell: bash
        run: |
          set -euo pipefail
          BIN=$PWD/target/release/req-guard
          P=$(mktemp -d); trap 'rm -rf "$P"' EXIT
          "$BIN" init -p "$P" >/dev/null
          test -f "$P/.gates/ci/req-guard-ci.yml"   # 接入样例随 install 生成
          test -f "$P/.gates/hooks/req-guard-deny.sh"

          # L3 fail-closed 双向自举：init **有意不替用户写 CI 编排**（那是仓库配置，
          # core/src/gate.rs 安装流程有明确注释），而 enforce.ci 默认 true ——
          # 因此"刚 init 完就全绿"是错误假设：未接 CI 时 verify 必须红，
          # 否则"默认三层"名不副实（本机 --no-verify 在服务端无人抵消）。
          if "$BIN" install --verify -p "$P" 2>/dev/null; then echo "未接 CI 应红"; exit 1; fi
          # 按 verify 的提示把样例复制进 CI 目录 → 应全绿
          mkdir -p "$P/.github/workflows"
          cp "$P/.gates/ci/req-guard-ci.yml" "$P/.github/workflows/req-guard-ci.yml"
          "$BIN" install --verify -p "$P"           # 接入 CI 后应全绿

          "$BIN" ids --check -p "$P"                # 编号防冲突：空目录应全绿

          # 1) 未创建需求 → check 拦截（退出码 1）
          if "$BIN" check -p "$P" 2>/dev/null; then echo "应拦截却放行"; exit 1; fi

          # 2) 创建并三段通过 → check 放行
          "$BIN" create -t "CI 自举" -p "$P" >/dev/null
          "$BIN" approve REQ-001 --step decomposition --reviewer 张三 -p "$P" >/dev/null
          "$BIN" approve REQ-001 --step solution      --reviewer 张三 -p "$P" >/dev/null
          "$BIN" approve REQ-001 --step testplan      --reviewer 张三 -p "$P" >/dev/null
          "$BIN" check -p "$P"                        # 全批后应放行（退出码 0）

          # 2.5) 伪造"同 id 双文件"（REQ-001-x.md 与已生成的 REQ-001-*.md 同 id、
          #      slug 不同——git 合并时零冲突静默共存）→ ids --check 应红（退出码 1）
          printf '<!-- GATE:HEAD id=REQ-001 status=draft created=0 -->\n' \
            > "$P/.gates/requirements/REQ-001-x.md"
          if "$BIN" ids --check -p "$P" 2>/dev/null; then echo "双 id 应红"; exit 1; fi

          # 3) 在用工具配置存在但缺 hook → install --verify 应红（L1 缺口检出）
          printf '{"other":true}' > "$P/.codebuddy/settings.json"
          if "$BIN" install --verify -p "$P" 2>/dev/null; then echo "缺 hook 应红"; exit 1; fi
          echo "gate self-check: 全部通过"
