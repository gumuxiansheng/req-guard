# req-guard — AI 需求门禁声明
# 目标：AI 在编写代码前，必须先完成三段清单并经审核人批准；否则硬拦截。
# 本文件随仓库版本化，改动须走评审（与团队规范同源）。
version: 1
enabled: true

# 三段清单（顺序即默认强制审核顺序）
steps:
  - name: decomposition
    label: 需求分解
  - name: solution
    label: 技术方案
  - name: testplan
    label: 测试计划

# 强制顺序：审核后一步之前，其前置步骤必须已 approved
strict_order: true

# 拦截点
enforce:
  ai_tool_hook: true   # AI 工具 PreToolUse，拦截 Write/Edit —— 最硬的一层
  pre_commit: true     # git pre-commit 兜底
  ci: true             # CI 侧拦截：流水线须调用 req-guard check，并设为必需（required）状态检查

# 被拦截的 AI 写操作（matcher 语法随工具而异）
blocked_tools:
  - Write
  - Edit
  - MultiEdit
  - NotebookEdit

# 审批严格等级（0–3，逐级包含；判定见 core/src/auth.rs）。
# 背景：方案 A（AI 会话标记）是白名单注入，未登记的 AI 工具（如 WorkBuddy）
# 会话内没有标记，"没标记 = 人类"会让审批锁**静默失效**。
#   0 = 仅方案 A 软标记（不打断存量项目）
#   1 = 审批"无凭据即拒"；且 token issue/revoke 必须人类在真实终端（TTY 挑战码）
#       —— 掐死"AI 执行 token issue 自签令牌再自批"
#   2 = 1 + 审批凭据只认进程内显式传入，不读 REQ_GUARD_TOKEN 环境变量
#       （环境变量会被同 shell 会话的 AI 子进程继承）；GUI 进程内签发并内存持有
#   3 = 2 + 凭据升级为一次性范围票据：绑定需求+步骤，用后即废（抗重放）
# 兼容旧键：仅写 auth.strict: true 而未写 level 时按 1 计。
auth:
  level: 3

# 应急绕过（有时效、必填原因、强制审计）
bypass:
  enabled: true
  default_ttl_minutes: 60
  require_reason: true

# 变更范围契约（GATE:TOUCH）
touch:
  # REQ-012 T9：`.gates/**` 通配已拆成具名清单。
  #
  # 本列表是**追加**到 `core/src/gate.rs::touch_exempt_patterns` 的默认集之上的，
  # 故「到底豁免了什么」要看两处（REQ-005 G3）。下方条目与那边的 RUNTIME 有重叠。
  #
  # 刻意**不在**豁免内的：`.gates/req-guard.yaml`（门禁配置，含 auth.level /
  # enforce.ci / touch.exempt）。放进豁免区等于允许 AI 自己把门禁调松。
  # 改它须由清单 `GATE:TOUCH` 声明 + 服务端漂移检测兜住（`config_drift_undeclared`），
  # 这样「改门禁配置」会在 PR 里变成一条明确的 CI 失败。
  #
  # 刻意**在**豁免内的：`.gates/audit/ledger.md`（审批台账）。此处更正一条**过时注释**
  # （REQ-020）：旧注释写它与 `req-guard.yaml` 一并「刻意不在豁免内」，与代码事实相反。
  # `gate.rs` 第 1448–1460 行记载了这是 REQ-012 实施期的刻意修正 —— 台账是工具在
  # 每次审批时自动追加的产物，移出豁免区等于「每次 approve 都让工作区变成 NotDeclared」，
  # 团队只有三条路：加回豁免 / `--no-verify` / 停止用台账。而台账真正的保护从来不是
  # touch：它已入库，任何篡改都是 PR 里可见的 diff，配上 CODEOWNERS 即为有效评审。
  exempt:
    - .gates/hooks/**
    - .gates/ci/**
    - .gates/drafts/**
    - .gates/requirements/**
    - .gates/README.md
    - .gates/audit/gate-audit.log
    - .gates/audit/ledger.md
    - .gates/audit/DIGEST
    - target/**
    - dist/**
    - Cargo.lock
    - .gitignore
  scope: union
  reapprove: true

# 分级门禁（REQ-019）：按**有效改动行数**与**路径敏感度**自动定档。
#
# 四档：trivial / light / standard / critical。档位 = max(清单 frontmatter 的
# `tier` 声明档, 按本次变更集算出的派生档) —— 声明只能往上抬，不能往下压；
# 派生档由 CI（L3 `check --base`）完整变更集复算，是权威层。
#
# 「有效改动行」剔除注释行与空行：把 `git diff -U0` 的两侧行号按**文件全文**
# 重建注释状态机后过滤，故只改注释/空行的变更有效行为 0 → 自动落进免审档。
#
# 口径与边界详见 docs/设计/分级门禁技术方案.md；回放校准见
# `python scripts/calibrate_tier.py`（G7：阈值不许拍脑袋写死）。
tier:
  # 关掉这一段（或整段置空）即**回滚**：派生档不生效，判定退回三段逐段批准，
  # 且门禁输出与启用前逐字一致。清单里的 `tier` 键保留即可（standard 在新旧
  # 枚举下都合法，回滚不需要改任何清单）。
  enabled: true
  # 阈值初值 5 / 80 来自历史变更集回放（最近 40 个提交：critical 21 / standard 11 /
  # light 8 / trivial 0）。本仓真实改动普遍远超 80 行，故 light 档主要覆盖
  # 「CI 配置 / 脚本小改 / 记忆笔记」这类小变更；**调阈值前请先重跑回放**。
  trivial_max_lines: 5
  light_max_lines: 80
  # 高危路径：命中即**至少 standard**（跳过 light / trivial）。
  # 内建锁定项（恒为 critical、不可配置）：core/src/**、templates/hooks/**、
  # templates/ci/**、.gates/req-guard.yaml —— 配置里写 `locked_paths` 键会被
  # 直接拒绝（GateError::Validation），「门禁可被自己调松」不留口子。
  risky_paths:
    - core/src/**
    - cli/src/**
    - gui/src/**
    - tui/src/**
    - scripts/**
    - templates/**
    - .gates/**

# 到期自动归档：done 满 N 天后，req-guard done 成功时自动把清单
# 物理搬入 .gates/requirements/archive/<创建年份>/（无日期段 → misc/）
# 0 = done 即刻归档；手动补扫：req-guard archive
archive:
  after_days: 30
