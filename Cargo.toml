[workspace]
resolver = "2"
members = ["core", "cli", "tui", "gui"]
# 默认只构建零依赖的 core + cli：根目录 `cargo build` 依然是秒级、无 UI 依赖。
# 需要界面时显式指定：`cargo build -p req-guard --features tui`。
default-members = ["core", "cli"]

# 目标形态（《UI架构细化方案.md》§1.1）：
#   core  req-guard-core   零依赖 lib：全部业务逻辑
#   cli   req-guard        唯一 bin：参数解析 + 文本输出（feature 门控 TUI/GUI）
#   tui   req-guard-tui    lib：终端界面（ratatui）—— P2
#   gui   req-guard-gui    lib：桌面管理台（eframe）—— P3
# tui / gui 设计为 **lib**，可被 feature 链进同一个二进制，实现"单文件 + 自动选界面"。

[workspace.package]
version = "0.1.3"
edition = "2021"

[profile.release]
opt-level = 3
strip = true
